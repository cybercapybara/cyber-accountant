        '400': { description: Validation failed (missing/wrong-type field, or a malformed employee_id) }
        '403': { description: 'No org context, or caller''s role is viewer' }
        '422': { description: 'starts_on/ends_on is not calendar-valid, ends_on is before starts_on, days is not positive, kind is not one of the registered values, or employee_id does not belong to this organization' }

  # ── Payroll ────────────────────────────────────────────────────────────────
  /api/v1/payroll-runs:
    get:
      summary: List payroll runs for the caller's organization (paginated, optional ?year filter)
      tags: [payroll]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: year,   in: query, schema: { type: integer, minimum: 2000, maximum: 2100 } }
        - { name: limit,  in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Payroll-run page (headers only — `payslips` is empty here)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollRunListResponse' }
        '403': { description: No org context }
        '422': { description: year is present but not an in-range 4-digit calendar year }
    post:
      summary: Calculate (or recalculate) a period's payroll run (accountant/owner only)
      description: |
        Runs Payroll::calculate over every ACTIVE employee and persists the
        run header plus one payslip each, resolving rates/constants on the
        last calendar day of the period. Answers 200, not 201: a second call
        for the same period REPLACES the draft's payslips rather than
        creating a second run (payroll_runs is UNIQUE per org/period).
        Recalculating a run that is already approved is a 409.
      tags: [payroll]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayrollRunCreate' }
      responses:
        '200':
          description: The run with every payslip it produced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollRunDetailResponse' }
        '400': { description: Validation failed (missing/wrong-type field) }
        '403': { description: 'No org context, or caller''s role is viewer' }
        '409': { description: The run for this period is already approved and cannot be recalculated }
        '422': { description: 'year or month is out of range, or no tax rate/constant is in force on the last day of the period (the response names the missing one)' }

  /api/v1/payroll-runs/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Approve a draft payroll run (accountant/owner only)
      tags: [payroll]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Approved, with the run's payslips
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollRunDetailResponse' }
        '400': { description: Malformed id }
        '403': { description: 'No org context, or caller''s role is viewer' }
        '404': { description: Not found (including a run belonging to another organization) }
        '409': { description: The run exists but is not in status draft }

  /api/v1/payroll-runs/{id}/post-to-journal:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Post an approved payroll run to the journal as one balanced entry (accountant/owner only)
      description: |
        Sums every payslip and posts a single balanced journal entry (debit
        7210 for the full employer cost; credits 3350/3120/3220/3210/3230 and,
        when non-zero, 3150). The run must be `approved`, and a run that has
        already been posted (`journal_entry_id` set) is refused — both are
        409s, never a duplicate ledger entry.
      tags: [payroll]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostToJournalResponse' }
        '400': { description: Malformed id }
        '403': { description: 'No org context, or caller''s role is viewer' }
        '404': { description: Not found (including a run belonging to another organization) }
        '409': { description: 'The run is not approved yet, has already been posted, or has no payslips (empty_run)' }

  /api/v1/payroll-runs/{id}/payslips:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List a payroll run's payslips (unpaginated — one per active employee)
      tags: [payroll]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Payslips
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayslipListResponse' }
        '400': { description: Malformed id }
        '403': { description: No org context }
        '404': { description: Not found (including a run belonging to another organization) }

  /api/v1/payroll-runs/{id}/payslips/{employee_id}/generate-document:
    parameters:
      - { name: id,          in: path, required: true, schema: { type: string, format: uuid } }
      - { name: employee_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Generate the payslip document for one employee of a run (accountant/owner only)
      description: |
        Builds the `payslip` template input from the payslip + employee +
        organization, deep-merges an optional request body on top for the
        one field not on file (`net_words`), creates a draft document
        (doc_type='hr', source='generated') and enqueues a docgen.render job
        — same async contract as POST /documents/generate. Every other field
        is authoritative (the payslip's own amounts, the employee's iin/name,
        the organization's bin/name) and CANNOT be overridden: any other body
        key is a 422 `not_allowed_override` naming that field, checked before
        the merge. Amounts are rendered with Ledger::format_tiyn
        ("300000.00").
      tags: [payroll]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayslipDocumentExtra' }
      responses:
        '202':
          description: Accepted — render enqueued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateDocumentResponse' }
        '400': { description: 'Malformed id/employee_id, or body is not a JSON object' }
        '403': { description: 'No org context, or caller''s role is viewer' }
        '404': { description: 'No such run in this organization, or the run has no payslip for that employee' }
        '422': { description: 'The body tries to override a field derived from stored data (not_allowed_override), or the merged input fails the payslip template''s JSON Schema (e.g. net_words was not supplied)' }
        '503': { description: Job queue not enabled }

  # ── Tax ────────────────────────────────────────────────────────────────────
  /api/v1/tax/rates:
    get:
      summary: Tax rates and constants in force on a date
      description: |
        System reference data (`tax_rates`/`tax_constants` have no org_id at
        all — the documented exception #2 to org-scoping), intended for UI
        hints. The org guard only establishes that the caller has access to
        some organization.
      tags: [tax]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: on, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }, description: 'Effective date; defaults to today (UTC)' }
      responses:
        '200':
          description: Rates and constants in force
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxRatesResponse' }
        '403': { description: No org context }
        '422': { description: on is not a calendar-valid date }

  /api/v1/tax/calculations:
    get:
      summary: List stored tax calculations (paginated, optional ?kind and ?year filters)
      tags: [tax]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: kind,   in: query, schema: { type: string, enum: [snr_simplified, vat] } }
        - { name: year,   in: query, schema: { type: integer }, description: 'Matched against the year of period_from' }
        - { name: limit,  in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Calculation page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxCalculationListResponse' }
        '403': { description: No org context }
        '422': { description: 'kind is not one of the registered values, or year is not a 4-digit calendar year' }
    post:
      summary: Run a tax calculation for a period (accountant/owner only)
      description: |
        Computes СНР на основе упрощённой декларации (half-year) or НДС
        (quarter) from posted journal entries and stores it with both
        reproducibility snapshots. Answers 200, not 201: recalculating the
        same (kind, period) REPLACES the stored row rather than adding one.
      tags: [tax]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxCalculationCreate' }
      responses:
        '200':
          description: The calculation, with its input and result snapshots
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxCalculationDetailResponse' }
        '400': { description: Validation failed (missing/wrong-type field) }
        '403': { description: 'No org context, or caller''s role is viewer' }
        '422': { description: 'kind is not one of the registered values, period_from/period_to is not calendar-valid, period_to is before period_from, or no rate is in force on period_to' }

  /api/v1/tax/alerts:
    get:
      summary: Registration-threshold alerts for the caller's organization
      description: |
        Fires from 90% of either legal threshold (VAT registration, СНР
        income limit) measured over the trailing 12 months of posted income.
        `threshold_tiyn` always reports the real 100% threshold.
      tags: [tax]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: on, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }, description: 'As-of date; defaults to today (UTC)' }
      responses:
        '200':
          description: Alerts (possibly an empty list)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxAlertListResponse' }
        '403': { description: No org context }
        '422': { description: 'on is not a calendar-valid date, or a threshold constant is not in force on that date' }

  /api/v1/tax/deadlines:
    get:
      summary: Upcoming tax deadlines within a horizon
      description: |
        System reference data (`tax_deadlines` has no org_id — the documented
        exception #3 to org-scoping). Due dates are shifted off Saturday and
        Sunday; Kazakhstani public holidays are explicitly out of scope in P2.
      tags: [tax]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: on,           in: query, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }, description: 'As-of date; defaults to today (UTC)' }
        - { name: horizon_days, in: query, schema: { type: integer, minimum: 1, maximum: 3650, default: 90 }, description: 'Clamped into range rather than rejected' }
      responses:
        '200':
          description: Deadlines, soonest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxDeadlineListResponse' }
        '403': { description: No org context }
        '422': { description: on is not a calendar-valid date }

  /api/v1/tax/filings:
    get:
      summary: List tax filings for the caller's organization (paginated, optional ?kind filter)
      tags: [tax]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: kind,   in: query, schema: { type: string, enum: ['910.00', '300.00'] } }
        - { name: limit,  in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Filing page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxFilingListResponse' }
        '403': { description: No org context }
        '422': { description: kind is not one of the registered form codes }
    post:
      summary: Generate a ФНО filing — XML into object storage plus a printable form (accountant/owner only)
      description: |
        Everything that can reject the request runs first (allowlists —
        including the `document_input` override allowlist — the calculation
        lookup, the form/calculation kind pairing, the print template's JSON
        Schema over the merged `document_input`), so a rejected request
        leaves no object in storage and no document row behind. Only then is the XML written, the document created, the
        filing row inserted and the render job enqueued.

        `xml_ready` and `render_queued` are both best-effort flags and may be
        false in a successful 202 — see their schema descriptions.
        `schema_validated` on the stored filing is always false: KGD
        publishes no content XSD for any ФНО form.
      tags: [tax]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxFilingCreate' }
      responses:
        '202':
          description: Accepted — filing recorded, render enqueued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxFilingCreateResponse' }
        '400': { description: 'Validation failed (missing/wrong-type field, or a malformed calculation_id)' }
        '403': { description: 'No org context, or caller''s role is viewer' }
        '422': { description: 'kind is not a registered form code, calculation_id does not belong to this organization, the form does not match the calculation''s kind, the stored calculation cannot be rendered as this form (including a result_snapshot missing a figure the form needs), document_input tries to override a field derived from stored data (not_allowed_override), or the merged document_input fails the template''s JSON Schema' }
        '503': { description: 'Object storage is not configured, or the job queue is not enabled' }

  /api/v1/tax/filings/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get a tax filing
      tags: [tax]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Filing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxFilingDetailResponse' }
        '400': { description: Malformed id }
        '403': { description: No org context }
        '404': { description: Not found (including a filing belonging to another organization) }

  /api/v1/tax/filings/{id}/download-url:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Mint a presigned download URL for one of the filing's artifacts
      description: |
        `artifact=xml` points at the filing's own `xml_s3_key`;
        `artifact=pdf` points at the linked document's `s3_key`, written by
        the docgen.render worker — the two are always different objects.
        Read-only (mints a URL, writes nothing), so this route does NOT
        reject viewers.
      tags: [tax]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: artifact, in: query, schema: { type: string, enum: [xml, pdf], default: xml } }
      responses:
        '200':
          description: Presigned URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FilingDownloadUrlResponse' }
        '400': { description: Malformed id }
        '403': { description: No org context }
        '404': { description: Not found (including a filing belonging to another organization) }
        '409': { description: 'The requested artifact does not exist yet: no XML (no_xml), no printable document (no_document), or the document has not been rendered (not_rendered)' }
        '422': { description: artifact is neither xml nor pdf }
        '503': { description: Presigning requires the S3 storage backend }

  /api/v1/jobs:
    get:
      summary: List jobs (admin; newest first, offset-paginated)
      tags: [jobs]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: type,   in: query, schema: { type: string } }
        - { name: limit,  in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: "Job page: { data, total, limit, offset }"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobListResponse' }
        '403': { description: Not an admin }
    post:
      summary: Submit a background job
      tags: [jobs]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobCreate' }
      responses:
        '201': { description: Submitted }
        '400': { description: Validation failed }

  /api/v1/jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get job status
      tags: [jobs]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: OK }
        '404': { description: Not found }
    delete:
      summary: Cancel a pending/processing job
      tags: [jobs]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Cancelled }
        '404': { description: Not found or already finished }

  /api/v1/jobs/dlq:
    get:
      summary: List dead-letter queue jobs
      tags: [jobs]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: type,  in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DlqListResponse' }

  /api/v1/jobs/dlq/{id}/requeue:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Requeue a DLQ job (resets retry_count, pushes to live queue)
      tags: [jobs]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Requeued }
        '404': { description: Not found or not in DLQ }

