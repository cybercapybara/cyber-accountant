      responses:
        '202':
          description: Accepted — render enqueued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateDocumentResponse' }
        '400': { description: Malformed id, or body is not a JSON object }
        '403': { description: 'No org context, or caller''s role is viewer' }
        '404': { description: Not found (including a labor contract belonging to another organization) }
        '422': { description: 'The body tries to override a field derived from stored data (not_allowed_override), or the merged input fails the labor_contract template''s JSON Schema (e.g. a required free-text field was not supplied)' }
