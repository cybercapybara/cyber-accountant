      tags: [hr]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LaborContractCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LaborContractDetailResponse' }
        '400': { description: Validation failed (missing/wrong-type field, or a malformed employee_id) }
        '403': { description: 'No org context, or caller''s role is viewer' }
        '422': { description: 'signed_on/starts_on/ends_on is not calendar-valid, or employee_id does not belong to this organization' }

  /api/v1/labor-contracts/{id}/generate-document:
