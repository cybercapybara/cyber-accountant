openapi: 3.1.0
info:
  title: C++ REST API Template
  description: |
    Infrastructure endpoints for the C++ REST API template: health probes
    and a background-job API. Authentication is opt-in (auth.mode=jwt|bearer|none).
    Rate-limiting and idempotency are driven by headers.
  version: 1.0.0
  contact:
    name: Platform team
servers:
  - url: http://localhost:8080
    description: Local dev
  - url: https://api.example.com
    description: Production

# Global security — attached per-operation below where needed.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    # Browser-SPA session: the access JWT travels in an HttpOnly
    # __Host- cookie set by POST /api/auth/login (auth.cookies.* in
    # config/config.json). Same-origin only — the SPA never reads it
    # from JS; fetch sends it via credentials: 'include'.
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-access

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Opaque client-generated key. First request with this key + body hash
        is executed and its response cached; subsequent requests replay it.
        Conflicting body with the same key returns 422.
      schema:
        type: string
        maxLength: 256
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context header.
      schema:
        type: string
        pattern: '^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
        code: { type: string }

    ValidationError:
      type: object
      required: [error, errors]
      properties:
        error:
          type: string
          enum: [validation_failed]
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }

    # Mirrors Jobs::Job::to_json() in src/jobs/Jobs.hpp.
    Job:
      type: object
      required: [id, type, status, created_at]
      properties:
        id:          { type: string, format: uuid }
        type:        { type: string }
        payload:     { type: object, additionalProperties: true }
        status:
          type: string
          enum: [pending, processing, completed, failed, dead]
        result:      { nullable: true }
        error:       { type: string }
        worker_id:   { type: string }
        trace_id:    { type: string, description: W3C trace id of the submitting request — deep-link into Jaeger }
        retry_count: { type: integer }
        max_retries: { type: integer }
        created_at:  { type: integer, format: int64, description: Epoch seconds }
        updated_at:  { type: integer, format: int64, description: Epoch seconds }

    # Mirrors Domain::to_json(Role) in src/domain/Role.hpp.
    Role:
      type: object
      required: [id, name, permissions, is_default]
      properties:
        id:          { type: integer }
        name:        { type: string }
        permissions: { type: integer, description: Bitmask — Domain::Permission::k* }
        is_default:  { type: boolean }

    # Mirrors Domain::to_json(User) in src/domain/User.hpp.
    # `role` is only present when the row was loaded with its role joined.
    User:
      type: object
      required: [id, email, full_name, confirmed, role_id, created_at, updated_at]
      properties:
        id:         { type: string, format: uuid }
        email:      { type: string, format: email }
        first_name: { type: ['string', 'null'] }
        last_name:  { type: ['string', 'null'] }
        full_name:  { type: string }
        confirmed:  { type: boolean }
        role_id:    { type: integer }
        role:       { $ref: '#/components/schemas/Role' }
        created_at: { type: string }
        updated_at: { type: string }

    UserListResponse:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/User' }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    JobListResponse:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Job' }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    DlqListResponse:
      type: object
      required: [data, count, depth]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Job' }
        count: { type: integer, description: Number of jobs returned (after type filter + limit) }
        depth: { type: integer, description: Total DLQ depth (unfiltered) }

    AuditEntry:
      type: object
      required: [id, action, target_type, details, created_at]
      properties:
        id:          { type: integer, format: int64 }
        actor_id:    { type: string, nullable: true, description: Acting principal subject (uuid), or null for a system action }
        action:      { type: string, description: 'Dotted verb, e.g. user.create' }
        target_type: { type: string, description: 'Affected entity kind, e.g. user / role' }
        target_id:   { type: string, nullable: true, description: Affected entity id (uuid or int as text) }
        details:     { type: object, additionalProperties: true, description: Action-specific context }
        created_at:  { type: string, format: date-time }

    AuditListResponse:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    JobCreate:
      type: object
      required: [type]
      properties:
        type:        { type: string, minLength: 1 }
        payload:     { type: object, additionalProperties: true }
        max_retries: { type: integer, minimum: 0, maximum: 20 }

    # GET /api/auth/me, POST /api/auth/login, POST /api/auth/refresh.
    # Mirrors AuthController::me/login/refresh — Response::ok({{"user", user}}).
    MeResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }

    # GET/PATCH /api/admin/users/{id}, POST /api/admin/users.
    # Mirrors AdminController::getUser/updateUser/createUser —
    # Response::ok/created({{"data", user}}).
    UserDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }

    # POST /api/admin/invite. Mirrors AdminController::inviteUser —
    # Response::created({{"data", user}, {"message", "Invitation sent"}}).
    InviteResponse:
      type: object
      required: [data]
      properties:
        data:    { $ref: '#/components/schemas/User' }
        message: { type: string }

    # GET /api/admin/roles. Mirrors AdminController::listRoles —
    # Response::list({{"data", [...roles]}}).
    RolesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Role' }

    # POST/PATCH /api/admin/roles[/{id}]. Mirrors AdminController::createRole/
    # updateRole — Response::ok({{"data", role}}).
    RoleDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Role' }

    # Generic "{message: ...}" envelope: logout, delete user/role, etc.
    MessageResponse:
      type: object
      properties:
        message: { type: string }

    # Mirrors Tenancy::to_json(Organization) in src/tenancy/Organization.hpp.
    Organization:
      type: object
      required: [id, bin, name, tax_regime, vat_payer, status, created_at, updated_at]
      properties:
        id:         { type: string, format: uuid }
        bin:        { type: string, pattern: '^[0-9]{12}$', description: 12-digit BIN/IIN — format-only in v1, check digit is P1 }
        name:       { type: string }
        tax_regime: { type: string, enum: [snr_simplified, standard] }
        vat_payer:  { type: boolean }
        status:     { type: string, enum: [active, suspended, archived] }
        created_at: { type: string }
        updated_at: { type: string }

    # GET /api/v1/orgs/mine item shape: Organization + the caller's role in it.
    OrganizationWithRole:
      allOf:
        - $ref: '#/components/schemas/Organization'
        - type: object
          required: [role]
          properties:
            role: { type: string, enum: [owner, accountant, viewer] }

    OrganizationListResponse:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Organization' }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    OrganizationDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Organization' }

    MineOrganizationsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/OrganizationWithRole' }

    # Mirrors Tenancy::to_json(OrgMember) in src/tenancy/OrgMember.hpp.
    OrgMember:
      type: object
      required: [id, org_id, user_id, role, created_at, updated_at]
      properties:
        id:         { type: string, format: uuid }
        org_id:     { type: string, format: uuid }
        user_id:    { type: string, format: uuid }
        role:       { type: string, enum: [owner, accountant, viewer] }
        created_at: { type: string }
        updated_at: { type: string }

    OrgMemberDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/OrgMember' }

    # Mirrors Tenancy::to_json(MemberWithEmail) in src/tenancy/OrgMemberRepository.hpp.
    MemberWithEmail:
      type: object
      required: [user_id, email, role, created_at]
      properties:
        user_id:    { type: string, format: uuid }
        email:      { type: string, format: email }
        role:       { type: string, enum: [owner, accountant, viewer] }
        created_at: { type: string }

    MembersListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MemberWithEmail' }

    # POST /api/v1/orgs/{id}/switch. Mirrors
    # OrganizationsController::switchOrg — Response::ok({{"access", access}}).
    SwitchResponse:
      type: object
      required: [access]
      properties:
        access: { type: string, description: "New HS256 access JWT carrying an `org` claim set to {id}" }

    # Mirrors Ledger::to_json(Counterparty) in src/ledger/Counterparty.hpp.
    Counterparty:
      type: object
      required: [id, org_id, identifier, name, address, iik, bik, kbe, is_resident, vat_payer, contact_email, created_at, updated_at]
      properties:
        id:             { type: string, format: uuid }
        org_id:         { type: string, format: uuid }
        identifier:     { type: string, pattern: '^[0-9]{12}$', description: БИН/ИИН — check-digit validated (Ledger::is_valid_bin_iin) }
        name:           { type: string }
        address:        { type: string }
        iik:            { type: string, description: 'IBAN KZ.. — format not validated in P1' }
        bik:            { type: string }
        kbe:            { type: string }
        is_resident:    { type: boolean }
        vat_payer:      { type: boolean }
        contact_email:  { type: string }
        created_at:     { type: string }
        updated_at:     { type: string }

    # Shared POST/PATCH request body — CounterpartiesController::validate_and_fill.
    CounterpartyWrite:
      type: object
      required: [identifier, name]
      properties:
        identifier:    { type: string, pattern: '^[0-9]{12}$', description: 'БИН/ИИН, 12 digits + valid check digit' }
        name:          { type: string }
        address:       { type: string, default: '' }
        iik:           { type: string, default: '' }
        bik:           { type: string, default: '' }
        kbe:           { type: string, default: '' }
        is_resident:   { type: boolean, default: true }
        vat_payer:     { type: boolean, default: false }
        contact_email: { type: string, default: '' }

    CounterpartyListResponse:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Counterparty' }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    CounterpartyDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Counterparty' }

    # Mirrors Ledger::to_json(Account) in src/ledger/Account.hpp.
    Account:
      type: object
      required: [id, org_id, code, name_ru, name_kk, type, parent_code, currency_tracked, created_at, updated_at]
      properties:
        id:               { type: string, format: uuid }
        org_id:           { type: ['string', 'null'], format: uuid, description: 'null = system row from the standard chart, visible to every org' }
        code:             { type: string }
        name_ru:          { type: string }
        name_kk:          { type: string, description: 'Filled in P2 (bilingual ФНО forms); empty in P1' }
        type:             { type: string, enum: [asset, liability, equity, income, expense] }
        parent_code:      { type: ['string', 'null'] }
        currency_tracked: { type: boolean }
        created_at:       { type: string }
        updated_at:       { type: string }

    AccountListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Account' }

    # POST /api/v1/accounts request body — AccountsController::create.
    AccountCreate:
      type: object
      required: [code, name_ru, parent_code]
      properties:
        code:        { type: string, description: 'Must start with parent_code (subaccount-numbering convention)' }
        name_ru:     { type: string }
        name_kk:     { type: string, default: '' }
        parent_code: { type: string, description: 'Code of a system or this org''s own visible parent account' }

    AccountDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Account' }

    # Mirrors Ledger::to_json(Document) in src/ledger/Document.hpp.
    Document:
      type: object
      required: [id, org_id, doc_type, source, status, counterparty_id, s3_key, checksum_sha256, mime, size_bytes, template_slug, template_version, input_snapshot, created_at, updated_at]
      properties:
        id:               { type: string, format: uuid }
        org_id:           { type: string, format: uuid }
        doc_type:
          type: string
          enum: [invoice, avr, waybill, tax_invoice, reconciliation, power_of_attorney, incoming, bank_statement, hr, fno, other]
        source:           { type: string, enum: [generated, uploaded, email] }
        status:           { type: string, enum: [inbox, recognized, linked, archived, draft, final, sent] }
        counterparty_id:  { type: ['string', 'null'], format: uuid }
        s3_key:           { type: ['string', 'null'] }
        checksum_sha256:  { type: ['string', 'null'], pattern: '^[0-9a-f]{64}$' }
        mime:             { type: ['string', 'null'] }
        size_bytes:       { type: ['integer', 'null'], format: int64 }
        template_slug:    { type: ['string', 'null'] }
        template_version: { type: ['string', 'null'] }
        input_snapshot:   { type: ['object', 'null'], additionalProperties: true, description: 'Docgen input snapshot for source=generated rows; for source=uploaded rows via POST /documents/uploads it instead holds {"original_filename": "..."} — see Document.hpp' }
        created_at:       { type: string }
        updated_at:       { type: string }

    DocumentListResponse:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Document' }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    DocumentDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Document' }

    # POST /api/v1/documents/uploads request body.
    DocumentUploadCreate:
      type: object
      required: [filename, mime, doc_type]
      properties:
        filename: { type: string, maxLength: 255, description: 'Plain file name — no path separators, "..", leading dot, or control characters (422 invalid_filename otherwise); non-ASCII/spaces/parentheses are fine' }
        mime:     { type: string }
        doc_type:
          type: string
          enum: [invoice, avr, waybill, tax_invoice, reconciliation, power_of_attorney, incoming, bank_statement, hr, fno, other]

    # POST /api/v1/documents/uploads response — the new draft document plus
    # the presigned PUT URL the client uploads bytes to directly.
    DocumentUploadResponse:
      type: object
      required: [data, upload_url]
      properties:
        data:       { $ref: '#/components/schemas/Document' }
        upload_url: { type: string, description: 'Presigned S3 PUT URL, TTL 600s' }

    # POST /api/v1/documents/{id}/confirm-upload request body.
    DocumentConfirmUpload:
      type: object
      required: [size_bytes, checksum_sha256]
      properties:
        size_bytes:      { type: integer, format: int64, minimum: 0 }
        checksum_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }

    # POST /api/v1/documents/{id}/download-url response.
    DownloadUrlResponse:
      type: object
      required: [url]
      properties:
        url: { type: string, description: 'Presigned S3 GET URL, TTL 300s' }

    # Mirrors Ledger::to_json(JournalLine) in src/ledger/JournalEntry.hpp.
    JournalLine:
      type: object
      required: [id, entry_id, account_code, side, amount, counterparty_id, vat_amount]
      properties:
        id:              { type: string, format: uuid }
        entry_id:        { type: string, format: uuid }
        account_code:    { type: string }
        side:            { type: string, enum: [debit, credit] }
        amount:          { type: string, description: 'NUMERIC(18,2) as text, e.g. "1234.56" — always > 0' }
        counterparty_id: { type: ['string', 'null'], format: uuid }
        vat_amount:      { type: ['string', 'null'], description: 'NUMERIC(18,2) as text, >= 0 when present' }

    # POST /api/v1/journal-entries request body line — JournalController::parse_lines.
    JournalLineWrite:
      type: object
      required: [account_code, side, amount]
      properties:
        account_code:    { type: string }
        side:             { type: string, enum: [debit, credit] }
        amount:           { type: string, description: 'Decimal string, e.g. "1234.56"' }
        counterparty_id:  { type: string, format: uuid }
        vat_amount:       { type: string }

    # Mirrors Ledger::to_json(JournalEntry) in src/ledger/JournalEntry.hpp.
    # `lines` is always present but only populated by GET .../{id} — the list
    # endpoint returns header rows only (see JournalRepository's header).
    JournalEntry:
      type: object
      required: [id, org_id, entry_date, description, status, reverses_entry_id, created_by_user_id, lines]
      properties:
        id:                 { type: string, format: uuid }
        org_id:             { type: string, format: uuid }
        entry_date:         { type: string, format: date }
        description:        { type: string }
        status:             { type: string, enum: [draft, posted, reversed] }
        reverses_entry_id:  { type: ['string', 'null'], format: uuid }
        created_by_user_id: { type: ['string', 'null'], format: uuid }
        lines:
          type: array
          items: { $ref: '#/components/schemas/JournalLine' }

    # POST /api/v1/journal-entries request body — JournalController::create.
    JournalEntryCreate:
      type: object
      required: [entry_date, description, lines]
      properties:
        entry_date:  { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        description: { type: string }
        lines:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/JournalLineWrite' }

    JournalEntryListResponse:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/JournalEntry' }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    JournalEntryDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/JournalEntry' }

    # GET /api/v1/doc-templates item — Docgen::TemplateInfo (slug/version/schema).
    DocTemplate:
      type: object
      required: [slug, version, schema]
      properties:
        slug:    { type: string }
        version: { type: string, description: "On-disk vN label, e.g. 'v1'" }
        schema:  { type: object, additionalProperties: true, description: 'JSON Schema (draft-07) the template''s input must satisfy' }

    DocTemplateListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DocTemplate' }

    # POST /api/v1/documents/generate request body.
    GenerateDocumentCreate:
      type: object
      required: [template_slug]
      properties:
        template_slug:   { type: string, enum: [invoice, avr, waybill, tax_invoice, reconciliation], description: 'Also the resulting document''s doc_type — the mapping is the identity function' }
        input:            { type: object, additionalProperties: true, description: 'Validated against the template''s JSON Schema' }
        counterparty_id:  { type: string, format: uuid, description: 'Must belong to the caller''s organization (422 foreign_counterparty otherwise)' }
        link_entry_id:    { type: string, format: uuid, description: 'Journal entry to link this document to (document_entries); must belong to the caller''s organization (422 foreign_journal_entry otherwise)' }

    # POST /api/v1/documents/generate response — 202, the render runs async.
    GenerateDocumentResponse:
      type: object
      required: [document_id, render_queued]
      properties:
        document_id:   { type: string, format: uuid, description: 'Poll GET /api/v1/documents/{id} for the final rendered status' }
        render_queued: { type: boolean, description: 'false if the docgen.render job could not be enqueued (e.g. a transient Redis error) — the document row still exists as draft; an operator must re-enqueue it (Fix round 1: best-effort enqueue)' }

    # Mirrors Hr::to_json(Employee) in src/hr/Employee.hpp.
    Employee:
      type: object
      required: [id, org_id, iin, last_name, first_name, middle_name, position, salary_tiyn, hired_on, dismissed_on, ipn_deduction_claimed, opvr_exempt, payout_iik, status, created_at, updated_at]
      properties:
        id:                    { type: string, format: uuid }
        org_id:                { type: string, format: uuid }
        iin:                   { type: string, pattern: '^[0-9]{12}$', description: '12 digits + valid check digit' }
        last_name:             { type: string }
        first_name:            { type: string }
        middle_name:           { type: ['string', 'null'] }
        position:              { type: string }
        salary_tiyn:           { type: integer, format: int64, description: 'Salary in tiyn (1/100 tenge)' }
        hired_on:              { type: string, format: date }
        dismissed_on:          { type: ['string', 'null'], format: date }
        ipn_deduction_claimed: { type: boolean }
        opvr_exempt:           { type: boolean }
        payout_iik:            { type: string }
        status:                { type: string, enum: [active, dismissed] }
        created_at:            { type: string }
        updated_at:            { type: string }

    EmployeeListResponse:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Employee' }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    EmployeeDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Employee' }

    # POST /api/v1/employees request body — EmployeesController::validate_and_fill_create.
    EmployeeCreate:
      type: object
      required: [iin, last_name, first_name, position, salary, hired_on]
      properties:
        iin:                   { type: string, pattern: '^[0-9]{12}$', description: 'ИИН, 12 digits + valid check digit' }
        last_name:             { type: string }
        first_name:            { type: string }
        middle_name:           { type: string }
        position:              { type: string }
        salary:                { type: string, description: 'Decimal string in tenge, e.g. "300000.00" — parsed via Ledger::parse_tiyn, must be strictly positive' }
        hired_on:               { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', description: 'Calendar-valid date; immutable after creation' }
        ipn_deduction_claimed: { type: boolean, default: false }
        opvr_exempt:           { type: boolean, default: false }
        payout_iik:            { type: string, default: '' }

    # PATCH /api/v1/employees/{id} request body — same as EmployeeCreate minus
    # hired_on (immutable) — EmployeesController::validate_and_fill_update.
    # hired_on/status/dismissed_on are all REJECTED with 422 if present (see
    # EmployeesController.hpp's file header) rather than accepted here.
    EmployeeUpdate:
      type: object
      required: [iin, last_name, first_name, position, salary]
      properties:
        iin:                   { type: string, pattern: '^[0-9]{12}$' }
        last_name:             { type: string }
        first_name:            { type: string }
        middle_name:           { type: string }
        position:              { type: string }
        salary:                { type: string, description: 'Decimal string in tenge, e.g. "300000.00"' }
        ipn_deduction_claimed: { type: boolean }
        opvr_exempt:           { type: boolean }
        payout_iik:            { type: string }

    # POST /api/v1/employees/{id}/dismiss request body.
    EmployeeDismiss:
      type: object
      required: [dismissed_on]
      properties:
        dismissed_on: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', description: 'Calendar-valid date' }

    # Mirrors Hr::to_json(HrOrder) in src/hr/HrDocuments.hpp.
    HrOrder:
      type: object
      required: [id, org_id, employee_id, kind, number, issued_on, effective_from, effective_to, payload, document_id, created_at, updated_at]
      properties:
        id:              { type: string, format: uuid }
        org_id:          { type: string, format: uuid }
        employee_id:     { type: string, format: uuid }
        kind:            { type: string, enum: [hire, dismiss, vacation, business_trip, salary_change] }
        number:          { type: string }
        issued_on:       { type: string, format: date }
        effective_from:  { type: string, format: date }
        effective_to:    { type: ['string', 'null'], format: date }
        payload:         { type: ['object', 'null'], additionalProperties: true }
        document_id:     { type: ['string', 'null'], format: uuid }
        created_at:      { type: string }
        updated_at:      { type: string }

    # GET /api/v1/hr-orders is paginated (`hr_orders` grows for the life of an
    # organization), so this is the {data, total, limit, offset} envelope every
    # other list route in this API uses — not the bare {data} it once was.
    HrOrderListResponse:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/HrOrder' }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    HrOrderDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/HrOrder' }

    # POST /api/v1/hr-orders request body — HrController::createOrder.
    HrOrderCreate:
      type: object
      required: [employee_id, kind, number, issued_on, effective_from]
      properties:
        employee_id:    { type: string, format: uuid, description: 'Must belong to the caller''s organization (422 foreign_employee otherwise)' }
        kind:           { type: string, enum: [hire, dismiss, vacation, business_trip, salary_change] }
        number:         { type: string }
        issued_on:      { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        effective_from: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        effective_to:   { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        payload:        { type: object, additionalProperties: true }

    # POST /api/v1/hr-orders/{id}/generate-document and
    # /api/v1/labor-contracts/{id}/generate-document request body — every
    # field OPTIONAL: the handler auto-derives what it can from the order/
    # contract/employee/organization records and deep-merges this body on
    # top (RFC 7396 merge patch) for the free-text fields the schema needs
    # that this codebase has no column for (director, salary_words,
    # work_schedule, ...) — see HrController.hpp's file header.
    GenerateHrDocumentExtra:
      type: object
      additionalProperties: true
      description: 'Merged on top of the auto-derived base input before template-schema validation; an empty/absent body is valid. ALLOWLISTED — hr_order accepts director/reason/details; labor_contract accepts salary_words/work_schedule/probation_months/employer.director/employer.address/employee.address. Anything else is rejected 422 not_allowed_override naming that field'

    # Mirrors Hr::to_json(LaborContract) in src/hr/HrDocuments.hpp.
    LaborContract:
      type: object
      required: [id, org_id, employee_id, number, signed_on, starts_on, ends_on, terms_json, created_at, updated_at]
      properties:
        id:          { type: string, format: uuid }
        org_id:      { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        number:      { type: string }
        signed_on:   { type: string, format: date }
        starts_on:   { type: string, format: date }
        ends_on:     { type: ['string', 'null'], format: date }
        terms_json:  { type: ['object', 'null'], additionalProperties: true }
        created_at:  { type: string }
        updated_at:  { type: string }

    LaborContractListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LaborContract' }

    LaborContractDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/LaborContract' }

    # POST /api/v1/labor-contracts request body — HrController::createContract.
    LaborContractCreate:
      type: object
      required: [employee_id, number, signed_on, starts_on]
      properties:
        employee_id: { type: string, format: uuid, description: 'Must belong to the caller''s organization (422 foreign_employee otherwise)' }
        number:      { type: string }
        signed_on:   { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        starts_on:   { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        ends_on:     { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        terms_json:  { type: object, additionalProperties: true }

    # Mirrors Hr::to_json(Vacation) in src/hr/HrDocuments.hpp.
    Vacation:
      type: object
      required: [id, org_id, employee_id, starts_on, ends_on, days, kind, created_at, updated_at]
      properties:
        id:          { type: string, format: uuid }
        org_id:      { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        starts_on:   { type: string, format: date }
        ends_on:     { type: string, format: date }
        days:        { type: integer }
        kind:        { type: string, enum: [annual, unpaid, sick] }
        created_at:  { type: string }
        updated_at:  { type: string }

    # Paginated for the same reason as HrOrderListResponse above.
    VacationListResponse:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Vacation' }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    VacationDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Vacation' }

    # POST /api/v1/vacations request body — HrController::createVacation.
    VacationCreate:
      type: object
      required: [employee_id, starts_on, ends_on, days, kind]
      properties:
        employee_id: { type: string, format: uuid, description: 'Must belong to the caller''s organization (422 foreign_employee otherwise)' }
        starts_on:   { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        ends_on:     { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', description: 'Must be on or after starts_on (422 before_starts_on otherwise)' }
        days:        { type: integer, minimum: 1 }
        kind:        { type: string, enum: [annual, unpaid, sick] }

    # ── Payroll (Task 12) ─────────────────────────────────────────────────
    # Mirrors Payroll::to_json(Payslip) in src/payroll/Payslip.hpp. Every
    # amount is an integer TIYN (1 ₸ = 100 tiyn) — never a decimal string,
    # unlike journal_lines.amount, because these columns are BIGINT.
    Payslip:
      type: object
      required: [id, org_id, run_id, employee_id, gross_tiyn, opv, vosms, ipn, net, opvr, so, osms, social_tax, created_at, updated_at]
      properties:
        id:          { type: string, format: uuid }
        org_id:      { type: string, format: uuid }
        run_id:      { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        gross_tiyn:  { type: integer, format: int64, description: 'Начислено, тиын' }
        opv:         { type: integer, format: int64, description: 'ОПВ, тиын' }
        vosms:       { type: integer, format: int64, description: 'ВОСМС, тиын' }
        ipn:         { type: integer, format: int64, description: 'ИПН, тиын' }
        net:         { type: integer, format: int64, description: 'К выплате, тиын' }
        opvr:        { type: integer, format: int64, description: 'ОПВР (за счёт работодателя), тиын' }
        so:          { type: integer, format: int64, description: 'СО, тиын' }
        osms:        { type: integer, format: int64, description: 'ОСМС, тиын' }
        social_tax:  { type: integer, format: int64, description: 'Социальный налог, тиын (0 на СНР упрощёнке)' }
        created_at:  { type: string }
        updated_at:  { type: string }

    # Mirrors Payroll::to_json(PayrollRun) in src/payroll/Payslip.hpp.
    # `payslips` is populated only by POST /payroll-runs (which has them in
    # hand); list/approve responses carry the header alone.
    PayrollRun:
      type: object
      required: [id, org_id, period_year, period_month, status, calculated_at, rates_snapshot, journal_entry_id, posted_at, created_at, updated_at, payslips]
      properties:
        id:               { type: string, format: uuid }
        org_id:           { type: string, format: uuid }
        period_year:      { type: integer }
        period_month:     { type: integer, minimum: 1, maximum: 12 }
        status:           { type: string, enum: [draft, approved] }
        calculated_at:    { type: string }
        rates_snapshot:   { type: object, additionalProperties: true, description: 'Exact rates/constants resolved on the last day of the period — the reproducibility record' }
        journal_entry_id: { type: ['string', 'null'], format: uuid, description: 'Non-null once posted; the compare-and-swap guard against a double post' }
        posted_at:        { type: ['string', 'null'] }
        created_at:       { type: string }
        updated_at:       { type: string }
        payslips:
          type: array
          items: { $ref: '#/components/schemas/Payslip' }

    PayrollRunListResponse:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PayrollRun' }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    PayrollRunDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/PayrollRun' }

    PayslipListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Payslip' }

    # POST /api/v1/payroll-runs request body — PayrollController::calculate.
    PayrollRunCreate:
      type: object
      required: [year, month]
      properties:
        year:  { type: integer, minimum: 2000, maximum: 2100 }
        month: { type: integer, minimum: 1, maximum: 12 }

    # POST /api/v1/payroll-runs/{id}/post-to-journal response.
    PostToJournalResponse:
      type: object
      required: [entry_id]
      properties:
        entry_id: { type: string, format: uuid, description: 'The single balanced journal entry this run was posted as' }

    # POST /api/v1/payroll-runs/{id}/payslips/{employee_id}/generate-document
    # request body — deep-merged (RFC 7396) over the base input derived from
    # the payslip/employee/organization. The payslip template requires
    # `net_words` (the net amount in Russian words), which this codebase
    # cannot derive — supply it here or the request is a 422. It is also the
    # ONLY accepted key: every other field of that template comes from stored
    # data, so any other key is a 422 not_allowed_override.
    PayslipDocumentExtra:
      type: object
      additionalProperties: true
      description: 'Merged on top of the auto-derived base input before template-schema validation. ALLOWLISTED — `net_words` is the only accepted key; anything else is rejected 422 not_allowed_override naming that field'

    # ── Tax (Task 12) ─────────────────────────────────────────────────────
    # Mirrors Tax::to_json(Rate) in src/tax/TaxRate.hpp.
    TaxRate:
      type: object
      required: [id, kind, rate_bp, region, effective_from, effective_to, source_note]
      properties:
        id:             { type: string, format: uuid }
        kind:           { type: string, enum: [vat, snr_simplified, ipn, opv, opvr, so, osms, vosms, social_tax] }
        rate_bp:        { type: integer, format: int64, description: 'Basis points (1 bp = 0.01%), e.g. 1600 = 16%' }
        region:         { type: ['string', 'null'], description: 'null = republic-wide default' }
        effective_from: { type: string, format: date }
        effective_to:   { type: ['string', 'null'], format: date }
        source_note:    { type: string }

    # Mirrors Tax::to_json(Constant) in src/tax/TaxRate.hpp.
    TaxConstant:
      type: object
      required: [id, key, value_tiyn, value_units, effective_from, effective_to, source_note]
      properties:
        id:             { type: string, format: uuid }
        key:            { type: string, description: 'e.g. mrp, mzp, ipn_deduction_mrp, vat_threshold_tenge' }
        value_tiyn:     { type: integer, format: int64 }
        value_units:    { type: ['integer', 'null'], format: int64, description: 'Multiplier of МРП/МЗП when the value is legally expressed that way' }
        effective_from: { type: string, format: date }
        effective_to:   { type: ['string', 'null'], format: date }
        source_note:    { type: string }

    TaxRatesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [on, rates, constants]
          properties:
            on: { type: string, format: date, description: 'The effective date the lists were resolved at (defaults to today)' }
            rates:
              type: array
              items: { $ref: '#/components/schemas/TaxRate' }
            constants:
              type: array
              items: { $ref: '#/components/schemas/TaxConstant' }

    # Mirrors Tax::to_json(Calculation) in src/tax/TaxCalculation.hpp.
    TaxCalculation:
      type: object
      required: [id, org_id, kind, period_from, period_to, computed_at, input_snapshot, result_snapshot, total_tiyn]
      properties:
        id:              { type: string, format: uuid }
        org_id:          { type: string, format: uuid }
        kind:            { type: string, enum: [snr_simplified, vat] }
        period_from:     { type: string, format: date }
        period_to:       { type: string, format: date }
        computed_at:     { type: string }
        input_snapshot:  { type: object, additionalProperties: true, description: 'Every rate/constant/account-set/period bound the calculation used' }
        result_snapshot: { type: object, additionalProperties: true, description: 'Every intermediate and final figure, all in tiyn' }
        total_tiyn:      { type: integer, format: int64, description: 'Tax due (snr_simplified) or net VAT balance (vat) — signed: negative is a refund position' }

    TaxCalculationListResponse:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TaxCalculation' }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    TaxCalculationDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/TaxCalculation' }

    # POST /api/v1/tax/calculations request body — TaxController::createCalculation.
    TaxCalculationCreate:
      type: object
      required: [kind, period_from, period_to]
      properties:
        kind:        { type: string, enum: [snr_simplified, vat] }
        period_from: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', description: 'Half-year start for snr_simplified, quarter start for vat' }
        period_to:   { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', description: 'Must be on or after period_from' }

    # Mirrors Tax::to_json(Alert) in src/tax/TaxService.hpp.
    TaxAlert:
      type: object
      required: [kind, message, current_tiyn, threshold_tiyn]
      properties:
        kind:           { type: string, enum: [vat_registration, snr_limit] }
        message:        { type: string }
        current_tiyn:   { type: integer, format: int64, description: 'Trailing-12-month posted income, tiyn' }
        threshold_tiyn: { type: integer, format: int64, description: 'The real (100%) legal threshold — an alert fires from 90% of it' }

    TaxAlertListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TaxAlert' }

    # Mirrors Tax::to_json(Deadline) in src/tax/TaxCalendar.hpp.
    TaxDeadline:
      type: object
      required: [form, kind, period_label, due_date, days_left]
      properties:
        form:         { type: string, description: 'e.g. "910.00", "300.00"' }
        kind:         { type: string, description: 'e.g. "report", "payment"' }
        period_label: { type: string, description: 'Russian label, e.g. "I полугодие 2026"' }
        due_date:     { type: string, format: date, description: 'Already shifted off Saturday/Sunday (public holidays are out of scope in P2)' }
        days_left:    { type: integer }

    TaxDeadlineListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TaxDeadline' }

    # Mirrors Tax::to_json(Filing) in src/tax/TaxFiling.hpp.
    TaxFiling:
      type: object
      required: [id, org_id, kind, period_from, period_to, status, calculation_id, xml_s3_key, document_id, schema_validated, created_at, updated_at]
      properties:
        id:               { type: string, format: uuid }
        org_id:           { type: string, format: uuid }
        kind:             { type: string, enum: ['910.00', '300.00'], description: 'ФНО form code — a different vocabulary from the calculation kind' }
        period_from:      { type: string, format: date }
        period_to:        { type: string, format: date }
        status:           { type: string, enum: [draft, generated, submitted_manually] }
        calculation_id:   { type: string, format: uuid }
        xml_s3_key:       { type: ['string', 'null'], description: 'null while status is draft (the XML never reached storage)' }
        document_id:      { type: ['string', 'null'], format: uuid, description: 'The printable form; poll GET /api/v1/documents/{id} for its render status' }
        schema_validated: { type: boolean, description: 'Always false — KGD publishes no content XSD for any ФНО form' }
        created_at:       { type: string }
        updated_at:       { type: string }

    TaxFilingListResponse:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TaxFiling' }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    TaxFilingDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/TaxFiling' }

    # POST /api/v1/tax/filings request body — TaxController::createFiling.
    TaxFilingCreate:
      type: object
      required: [kind, calculation_id]
      properties:
        kind:           { type: string, enum: ['910.00', '300.00'] }
        calculation_id: { type: string, format: uuid, description: '910.00 needs a snr_simplified calculation, 300.00 a vat one (422 kind_mismatch otherwise); must belong to the caller''s organization' }
        document_input:
          type: object
          additionalProperties: true
          description: 'Deep-merged (RFC 7396) over the auto-derived print-form input before template-schema validation. ALLOWLISTED — only the fields the database cannot hold may appear: director, accountant, tax_words (910.00); director, accountant, balance_words (300.00). Any other key — the org identity, the period, and every amount including the ФНО 300.00 revenue turnover `sales_tenge`, which is derived from the calculation''s own snapshot — is rejected 422 not_allowed_override naming that field, before the merge happens. Left open here (additionalProperties) because the accepted set depends on `kind`; the server is the authority'

    # POST /api/v1/tax/filings response — both flags are best-effort.
    TaxFilingCreateResponse:
      type: object
      required: [filing_id, xml_ready, render_queued]
      properties:
        filing_id:     { type: string, format: uuid }
        xml_ready:     { type: boolean, description: 'false if the XML could not be written to object storage — the filing row still exists, in status draft with a null xml_s3_key' }
        render_queued: { type: boolean, description: 'false if the docgen.render job could not be enqueued — the document row still exists as draft' }

    # POST /api/v1/tax/filings/{id}/download-url response.
    FilingDownloadUrlResponse:
      type: object
      required: [url, artifact, key]
      properties:
        url:      { type: string, description: 'Presigned S3 GET URL, TTL 300s' }
        artifact: { type: string, enum: [xml, pdf] }
        key:      { type: string, description: 'The object key the URL points at — different per artifact' }

# -----------------------------------------------------------------------------
paths:
  /:
    get:
      summary: Endpoint discovery — list every registered route
      tags: [health]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  version: { type: string }
                  endpoints:
                    type: array
                    items:
                      type: object
                      required: [method, path, description]
                      properties:
                        method: { type: string }
                        path: { type: string }
                        description: { type: string }
  /healthz:
    get:
      summary: Liveness probe
      tags: [health]
      responses:
        '200':
          description: Process is alive
  /ready:
    get:
      summary: Readiness probe
      tags: [health]
      responses:
        '200': { description: Ready }
        '503': { description: Draining or dependency unhealthy }
  /health:
    get:
      summary: Detailed component health
      tags: [health]
      responses:
        '200': { description: All components healthy }
        '503': { description: One or more components unhealthy }

  # ── Auth ───────────────────────────────────────────────────────────────────
  /api/v1/auth/register:
    post:
      summary: Register a new user
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:      { type: string, format: email }
                password:   { type: string, minLength: 8, maxLength: 128 }
                first_name: { type: string }
                last_name:  { type: string }
      responses:
        '201':
          description: User created — confirmation email queued
        '400': { description: Validation failed }
        '409': { description: Email already registered }
  /api/v1/auth/login:
    post:
      summary: Log in
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Logged in — Set-Cookie access + refresh
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { description: Invalid email or password }
  /api/v1/auth/logout:
    post:
      summary: Log out (clears cookies + revokes refresh token)
      tags: [auth]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
  /api/v1/auth/refresh:
    post:
      summary: Rotate access + refresh tokens
      tags: [auth]
      responses:
        '200':
          description: New cookies issued
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { description: Refresh token missing / expired / revoked }
  /api/v1/auth/me:
    get:
      summary: Get the authenticated user
      tags: [auth]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { description: Not authenticated }

  # ── Account self-service ───────────────────────────────────────────────────
  /api/v1/account/confirm-resend:
    post:
      summary: Resend the email-confirmation link to the current user
      tags: [account]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Confirmation email queued }
        '401': { description: Not authenticated }
  /api/v1/account/confirm/{token}:
    post:
      summary: Confirm an account from an email link
      tags: [account]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Account confirmed }
        '400': { description: Invalid or expired token }
        '404': { description: User not found }
  /api/v1/account/reset-password-request:
    post:
      summary: Start a password reset (email-based)
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: If the email is registered, a reset link is on its way }
  /api/v1/account/reset-password/{token}:
    post:
      summary: Apply a password reset using an email-link token
      tags: [account]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200': { description: Password updated }
        '400': { description: Invalid or expired token }
  /api/v1/account/change-email-request:
    post:
      summary: Start an email-change flow (verifies password, mails a link to new address)
      tags: [account]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_email, password]
              properties:
                new_email: { type: string, format: email }
                password:  { type: string }
      responses:
        '200': { description: Confirmation email sent to the new address }
        '401': { description: Wrong password or not authenticated }
  /api/v1/account/change-email/{token}:
    post:
      summary: Apply a pending email change from token
      tags: [account]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Email updated }
        '400': { description: Invalid or expired token }
        '409': { description: Email already in use }
  /api/v1/account/join-from-invite/{token}:
    post:
      summary: Set password and confirm account from an invite token
      tags: [account]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200': { description: Account ready — the invitee can now sign in }
        '400': { description: Invalid or expired invitation token }
  /api/v1/account/change-password:
    post:
      summary: Change password while logged in (verifies old password)
      tags: [account]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string }
                new_password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200': { description: Password updated }
        '401': { description: Wrong current password or not authenticated }

  /api/v1/account/api-keys:
    get:
      summary: List your API keys (metadata only; never the secret)
      tags: [account]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: "Array of API key metadata under data[]" }
        '401': { description: Not authenticated }
    post:
      summary: Create an API key — the secret is returned ONCE in this response
      tags: [account]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201': { description: Key created; `key` field holds the one-time secret }
        '401': { description: Not authenticated }

  /api/v1/account/api-keys/{id}:
    delete:
      summary: Revoke one of your API keys
      tags: [account]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Key revoked }
        '401': { description: Not authenticated }
        '404': { description: No such key (or not yours) }

  # ── Admin (require Permission::ADMINISTER) ────────────────────────────────
  /api/v1/admin/users:
    get:
      summary: List users (admin)
      tags: [admin]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit,  in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: User page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListResponse' }
        '403': { description: Not an admin }
    post:
      summary: Create a confirmed user (admin)
      tags: [admin]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:      { type: string, format: email }
                password:   { type: string, minLength: 8, maxLength: 128 }
                first_name: { type: string }
                last_name:  { type: string }
                role_id:    { type: integer }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetailResponse' }
        '400': { description: Validation failed }
        '403': { description: Not an admin }
        '409': { description: Email already registered }
  /api/v1/admin/invite:
    post:
      summary: Invite a user via email (admin)
      tags: [admin]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:      { type: string, format: email }
                first_name: { type: string }
                last_name:  { type: string }
                role_id:    { type: integer }
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteResponse' }
        '403': { description: Not an admin }
        '409': { description: Email already registered }
  /api/v1/admin/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: User detail (admin)
      tags: [admin]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: User row with role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetailResponse' }
        '403': { description: Not an admin }
        '404': { description: User not found }
    patch:
      summary: Update user — email / role_id / first_name / last_name (admin)
      tags: [admin]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email:      { type: string, format: email }
                role_id:    { type: integer }
                first_name: { type: string }
                last_name:  { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetailResponse' }
        '400': { description: Self role-change refused or validation failed }
        '403': { description: Not an admin }
        '404': { description: User not found }
        '409': { description: Email already taken }
    delete:
      summary: Delete user (admin)
      tags: [admin]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { description: Self-delete refused }
        '403': { description: Not an admin }
        '404': { description: User not found }
  /api/v1/admin/roles:
    get:
      summary: List roles (admin)
      tags: [admin]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolesResponse' }
        '403': { description: Not an admin }
    post:
      summary: Create a role (admin)
      tags: [admin]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, permissions]
              properties:
                name:        { type: string, minLength: 1, maxLength: 64 }
                permissions: { type: integer, description: Bitmask — see Domain::Permission::k* in src/domain/Role.hpp }
                is_default:  { type: boolean, default: false }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleDetailResponse' }
        '400': { description: Validation failed }
        '403': { description: Not an admin }
        '409': { description: Role name already exists }
  /api/v1/admin/roles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      summary: Update role (admin) — partial; pass any of name / permissions / is_default
      tags: [admin]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:        { type: string, minLength: 1, maxLength: 64 }
                permissions: { type: integer }
                is_default:  { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleDetailResponse' }
        '400': { description: Empty patch or invalid id }
        '403': { description: Not an admin }
        '404': { description: Role not found }
        '409': { description: Role name already exists }
    delete:
      summary: Delete role (admin)
      tags: [admin]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { description: Default role cannot be deleted }
        '403': { description: Not an admin }
        '404': { description: Role not found }
        '409': { description: Role is referenced by users — reassign first }

  /api/v1/admin/audit:
    get:
      summary: List the audit trail (admin)
      description: Requires the audit-read permission bit (Domain::Permission::kAuditRead); full admins hold it.
      tags: [admin]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit,       in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset,      in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: action,      in: query, schema: { type: string }, description: Exact action filter, e.g. user.create }
        - { name: actor_id,    in: query, schema: { type: string }, description: Filter by acting principal subject }
        - { name: target_type, in: query, schema: { type: string }, description: Filter by target kind, e.g. user / role }
        - { name: from,        in: query, schema: { type: string, format: date-time }, description: created_at lower bound }
        - { name: to,          in: query, schema: { type: string, format: date-time }, description: created_at upper bound }
      responses:
        '200':
          description: Audit page (newest first)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditListResponse' }
        '403': { description: Missing the audit-read permission }

  # ── Organizations (tenants) + membership ────────────────────────────────────
  /api/v1/orgs:
    get:
      summary: List organizations (admin)
      tags: [orgs]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit,  in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Organization page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationListResponse' }
        '403': { description: Not an admin }
    post:
      summary: Create an organization (admin) — tenants are provisioned by a system admin, not self-service
      tags: [orgs]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bin, name]
              properties:
                bin:        { type: string, pattern: '^[0-9]{12}$', description: 'Exactly 12 digits; check-digit validation is P1' }
                name:       { type: string }
                tax_regime: { type: string, enum: [snr_simplified, standard], default: snr_simplified }
                vat_payer:  { type: boolean, default: false }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationDetailResponse' }
        '400': { description: Validation failed (missing/wrong-type field) }
        '403': { description: Not an admin }
        '409': { description: An organization with that BIN already exists }
        '422': { description: BIN does not match the required 12-digit format }

  /api/v1/orgs/mine:
    get:
      summary: List the caller's organizations, each with their role in it
      tags: [orgs]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Organizations the caller is a member of
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MineOrganizationsResponse' }
        '401': { description: Not authenticated }

  /api/v1/orgs/{id}/switch:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Mint a new access token scoped to this organization
      description: |
        Issues a fresh access token with the SAME claim shape as the login/
        refresh access token (OrganizationsController::switchOrg mirrors
        AuthController::mint_session's access-claim assembly), plus an `org`
        claim set to {id}. Requires a live membership row for the caller in
        {id}. The refresh token/cookie is untouched.

        Sets the __Host-access cookie to the new token (cookie-mode clients
        never see the body — it's HttpOnly), in addition to returning it in
        the JSON body for Bearer-mode clients.

        Caveat for multi-org clients: after the next POST /api/v1/auth/refresh,
        the active org resets to mint_session's single-membership default
        (empty if the caller belongs to 0 or >1 organizations) — a client
        with more than one organization must call /switch again after every
        refresh to stay scoped to a non-default org. This will be handled by
        the frontend (Task 8).
      tags: [orgs]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: New access token — Set-Cookie access (refresh cookie untouched)
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SwitchResponse' }
        '400': { description: Malformed organization id }
        '401': { description: Not authenticated }
        '403': { description: Not a member of this organization }

  /api/v1/orgs/{id}/members:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List an organization's members, with email (admin, or owner of this organization)
      description: |
        Roster for the "Manage members" UI — OrgMember alone only carries
        user_id, which a caller has no way to act on; this joins each
        membership row with the user's email
        (OrgMemberRepository::list_members_with_email).
      tags: [orgs]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Every member of the organization, oldest membership first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembersListResponse' }
        '400': { description: Malformed organization id }
        '403': { description: Not an admin or owner of this organization }
    post:
      summary: Add a member to an organization, by user_id or by email (admin, or owner of this organization)
      description: |
        Request body accepts EITHER `{user_id, role}` OR `{email, role}` —
        never both (400 mutually_exclusive). The email variant resolves to
        a user_id via Repositories::UserRepository::find_by_email first
        (404 user_not_found if no such user has registered yet), then
        continues through the same add path as the user_id variant.
      tags: [orgs]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [user_id, role]
                  properties:
                    user_id: { type: string, format: uuid }
                    role:    { type: string, enum: [owner, accountant, viewer] }
                - type: object
                  required: [email, role]
                  properties:
                    email: { type: string, format: email }
                    role:  { type: string, enum: [owner, accountant, viewer] }
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgMemberDetailResponse' }
        '400': { description: Validation failed, or both user_id and email were given }
        '403': { description: Not an admin or owner of this organization }
        '404': { description: 'email variant: no user is registered with that email' }
        '409': { description: This user is already a member of the organization }

  /api/v1/orgs/{id}/members/{user_id}:
    parameters:
      - { name: id,      in: path, required: true, schema: { type: string, format: uuid } }
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Change a member's role (admin, or owner of this organization)
      tags: [orgs]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [owner, accountant, viewer] }
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgMemberDetailResponse' }
        '400': { description: Validation failed }
        '403': { description: Not an admin or owner of this organization }
        '404': { description: Member not found }
        '409': { description: Cannot demote the last owner of an organization }
    delete:
      summary: Remove a member from an organization (admin, or owner of this organization)
      tags: [orgs]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '403': { description: Not an admin or owner of this organization }
        '404': { description: Member not found }
        '409': { description: Cannot remove the last owner of an organization }

  /api/v1/counterparties:
    get:
      summary: List counterparties for the caller's organization (paginated)
      tags: [counterparties]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit,  in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Counterparty page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CounterpartyListResponse' }
        '403': { description: No org context }
    post:
      summary: Create a counterparty (accountant/owner only)
      tags: [counterparties]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CounterpartyWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CounterpartyDetailResponse' }
        '400': { description: Validation failed (missing/wrong-type field) }
        '403': { description: No org context, or caller's role is viewer }
        '409': { description: A counterparty with that identifier already exists in this organization }
        '422': { description: identifier is the right shape (12 digits) but fails the BIN/IIN check digit }

  /api/v1/counterparties/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get a counterparty
      tags: [counterparties]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Counterparty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CounterpartyDetailResponse' }
        '400': { description: Malformed id }
        '403': { description: No org context }
        '404': { description: Not found (including a counterparty belonging to another organization) }
    patch:
      summary: Replace a counterparty (accountant/owner only) — every editable field is patched in one call
      tags: [counterparties]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CounterpartyWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CounterpartyDetailResponse' }
        '400': { description: Validation failed (missing/wrong-type field) }
        '403': { description: No org context, or caller's role is viewer }
        '404': { description: Not found (including a counterparty belonging to another organization) }
        '409': { description: The patched identifier collides with another counterparty in this organization }
        '422': { description: identifier is the right shape (12 digits) but fails the BIN/IIN check digit }

  /api/v1/accounts:
    get:
      summary: List accounts visible to the caller's organization (standard chart + this org's own subaccounts), unpaginated
      tags: [accounts]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Visible accounts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountListResponse' }
        '403': { description: No org context }
    post:
      summary: Create a subaccount under a visible parent (accountant/owner only)
      tags: [accounts]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDetailResponse' }
        '400': { description: Validation failed (missing/wrong-type field) }
        '403': { description: No org context, or caller's role is viewer }
        '409': { description: An account with that code already exists for this organization (or is a reserved system code) }
        '422': { description: 'Parent not found/not visible, or code does not extend the parent''s code' }

  /api/v1/documents:
    get:
      summary: List documents for the caller's organization (paginated, optional type/status filters)
      tags: [documents]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: type, in: query, description: Filter by doc_type — must be one of the CHECK-listed values, schema: { type: string } }
        - { name: status, in: query, description: Filter by status — must be one of the CHECK-listed values, schema: { type: string } }
        - { name: limit,  in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Document page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentListResponse' }
        '403': { description: No org context }
        '422': { description: type or status is not one of the registered values }

  /api/v1/documents/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get a document
      tags: [documents]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentDetailResponse' }
        '400': { description: Malformed id }
        '403': { description: No org context }
        '404': { description: Not found (including a document belonging to another organization) }

  /api/v1/documents/{id}/download-url:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Mint a presigned download URL for this document's stored file
      description: |
        Read-only — mints a time-limited S3 GET URL (TTL 300s) and writes
        nothing, so this route does NOT reject viewers the way the mutating
        ledger routes do.
      tags: [documents]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Presigned URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadUrlResponse' }
        '400': { description: Malformed id }
        '403': { description: No org context }
        '404': { description: Not found (including a document belonging to another organization) }
        '409': { description: This document has no stored file yet (empty s3_key) }
        '503': { description: Presigning requires the S3 storage backend }

  /api/v1/documents/uploads:
    post:
      summary: Start a client-driven upload (accountant/owner only)
      description: |
        Creates a draft document (source=uploaded, status=draft) and mints a
        presigned S3 PUT URL (TTL 600s) the client uploads the file bytes to
        directly. The document's s3_key is persisted immediately
        (DocumentRepository::set_pending_upload) so a retried
        confirm-upload reads back the SAME key. Call
        POST /api/v1/documents/{id}/confirm-upload once the PUT completes.
      tags: [documents]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentUploadCreate' }
      responses:
        '201':
          description: Draft document + presigned upload URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentUploadResponse' }
        '400': { description: Validation failed (missing/wrong-type field) }
        '403': { description: No org context, or caller's role is viewer }
        '422': { description: 'doc_type is not one of the registered values, or filename is not a plain file name' }
        '503': { description: Presigning requires the S3 storage backend }

  /api/v1/documents/{id}/confirm-upload:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Verify an uploaded object and finalize the document (accountant/owner only)
      description: |
        Only valid for a document with source='uploaded' and status='draft'
        (i.e. one POST /documents/uploads started) — calling it on a
        source='generated' or already-'final' document is rejected before
        any storage check, so a client can never overwrite a document's
        real, reproducible checksum/mime/size with unverified values.
        Checks Storage::exists(s3_key) before trusting the client's
        reported size/checksum; on success calls
        DocumentRepository::set_file() and flips status to 'final'.
      tags: [documents]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentConfirmUpload' }
      responses:
        '200':
          description: Finalized document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentDetailResponse' }
        '400': { description: Validation failed (missing/wrong-type field) }
        '403': { description: No org context, or caller's role is viewer }
        '404': { description: Not found (including a document belonging to another organization) }
        '409':
          description: >-
            object_missing (no upload was started for this document, or the
            object was not found in storage) | invalid_state (document is not
            a draft, uploaded document — e.g. source='generated', or already
            confirmed to 'final')
        '422': { description: 'size_bytes out of range, or checksum_sha256 is not 64 lowercase hex characters' }
        '503': { description: Object storage is not configured }

  /api/v1/journal-entries:
    get:
      summary: List journal entries for the caller's organization (paginated, optional from/to entry_date filters)
      description: Header rows only — `lines` is always `[]` here; use GET /journal-entries/{id} for lines.
      tags: [journal]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: from, in: query, description: 'Inclusive lower bound on entry_date, YYYY-MM-DD', schema: { type: string } }
        - { name: to, in: query, description: 'Inclusive upper bound on entry_date, YYYY-MM-DD', schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Journal entry page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntryListResponse' }
        '403': { description: No org context }
        '422': { description: from or to is not in YYYY-MM-DD format }
    post:
      summary: Create a draft journal entry (accountant/owner only)
      tags: [journal]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JournalEntryCreate' }
      responses:
        '201':
          description: Created draft entry, with lines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntryDetailResponse' }
        '400': { description: 'Validation failed (missing/wrong-type field, or a line missing account_code/side/amount, or a malformed counterparty_id)' }
        '403': { description: 'No org context, or caller''s role is viewer' }
        '422': { description: 'entry_date is not YYYY-MM-DD, or the entry is unbalanced/unknown_account/foreign_counterparty/invalid_line (Ledger::JournalService typed errors)' }

  /api/v1/journal-entries/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get a journal entry with its lines
      tags: [journal]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Journal entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntryDetailResponse' }
        '400': { description: Malformed id }
        '403': { description: No org context }
        '404': { description: Not found (including an entry belonging to another organization) }

  /api/v1/journal-entries/{id}/post:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Post a draft journal entry (accountant/owner only)
      tags: [journal]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Posted entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntryDetailResponse' }
        '400': { description: Malformed id }
        '403': { description: 'No org context, or caller''s role is viewer' }
        '404': { description: Not found (including an entry belonging to another organization) }
        '409': { description: The entry is not in status 'draft' }

  /api/v1/journal-entries/{id}/reverse:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Reverse (storno) a posted journal entry (accountant/owner only)
      description: |
        Marks the original entry 'reversed' and returns a NEW, already-posted
        entry whose lines mirror the original with sides flipped
        (`reverses_entry_id` points back at the original).
      tags: [journal]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: The new storno entry, posted, with lines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntryDetailResponse' }
        '400': { description: Malformed id }
        '403': { description: 'No org context, or caller''s role is viewer' }
        '404': { description: Not found (including an entry belonging to another organization) }
        '409': { description: The entry is not in status 'posted' }

  /api/v1/doc-templates:
    get:
      summary: List registered docgen templates (slug, version, schema)
      description: Scans templates/latex/ (Docgen::TemplateRegistry::list()) — read-only, no viewer gate.
      tags: [docgen]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Registered templates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocTemplateListResponse' }
        '403': { description: No org context }

  /api/v1/documents/generate:
    post:
      summary: Generate a document from a template (accountant/owner only)
      description: |
        Validates `input` against the template's JSON Schema, creates a
        `draft` document (source=generated), optionally links it to a
        journal entry, and enqueues a `docgen.render` job. The render never
        runs on the request thread — poll GET /api/v1/documents/{id} for the
        final ('final') status and its download URL.
      tags: [docgen]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateDocumentCreate' }
      responses:
        '202':
          description: Accepted — render enqueued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateDocumentResponse' }
        '400': { description: 'Validation failed (missing/wrong-type field, or a malformed counterparty_id/link_entry_id)' }
        '403': { description: 'No org context, or caller''s role is viewer' }
        '422': { description: 'template_slug is not a registered template, input fails the template''s JSON Schema, or counterparty_id/link_entry_id does not belong to this organization' }
        '503': { description: Job queue not enabled }

  /api/v1/employees:
    get:
      summary: List employees for the caller's organization (paginated, includes dismissed)
      tags: [hr]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit,  in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Employee page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeListResponse' }
        '403': { description: No org context }
    post:
      summary: Create an employee (accountant/owner only)
      tags: [hr]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeDetailResponse' }
        '400': { description: Validation failed (missing/wrong-type field) }
        '403': { description: 'No org context, or caller''s role is viewer' }
        '409': { description: An employee with that IIN already exists in this organization }
        '422': { description: 'iin fails its check digit, salary fails to parse (Ledger::parse_tiyn), or hired_on is not a calendar-valid date' }

  /api/v1/employees/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get an employee
      tags: [hr]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Employee
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeDetailResponse' }
        '400': { description: Malformed id }
        '403': { description: No org context }
        '404': { description: Not found (including an employee belonging to another organization) }
    patch:
      summary: Patch an employee's editable fields (accountant/owner only)
      description: |
        Patches every field Hr::EmployeeRepository::update() allows in one
        call — hired_on/status/dismissed_on are NOT among them.
        Including any of those three (non-null) in the body is rejected with
        422, not silently ignored: hired_on is immutable after hire, and
        status/dismissed_on change only through
        POST /employees/{id}/dismiss.
      tags: [hr]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeDetailResponse' }
        '400': { description: Validation failed (missing/wrong-type field) }
        '403': { description: 'No org context, or caller''s role is viewer' }
        '404': { description: Not found (including an employee belonging to another organization) }
        '409': { description: The patched iin collides with another employee in this organization }
        '422': { description: 'iin fails its check digit, salary fails to parse, or hired_on/status/dismissed_on was included in the body' }

  /api/v1/employees/{id}/dismiss:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Dismiss an employee (accountant/owner only)
      description: |
        Sets status='dismissed' and dismissed_on in one call — the only way
        to change either field (Hr::EmployeeRepository::dismiss()). A wrong
        org, a missing id, and an already-dismissed employee are all
        indistinguishable 404s.
      tags: [hr]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeDismiss' }
      responses:
        '200':
          description: Dismissed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeDetailResponse' }
        '400': { description: Validation failed (missing/wrong-type field) }
        '403': { description: 'No org context, or caller''s role is viewer' }
        '404': { description: Not found, already dismissed, or belonging to another organization }
        '422': { description: dismissed_on is not a calendar-valid date }

  /api/v1/hr-orders:
