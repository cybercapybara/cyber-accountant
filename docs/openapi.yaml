      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HrOrderCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HrOrderDetailResponse' }
        '400': { description: Validation failed (missing/wrong-type field, or a malformed employee_id) }
        '403': { description: 'No org context, or caller''s role is viewer' }
        '422': { description: 'kind is not one of the registered values, issued_on/effective_from/effective_to is not calendar-valid, or employee_id does not belong to this organization' }

  /api/v1/hr-orders/{id}/generate-document:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Generate the hr_order document for an HR order (accountant/owner only)
      description: |
        Builds the hr_order template input from the order + its employee +
        the organization, deep-merges an optional request body on top for
        the free-text fields not on file (director, reason, details, ...),
        creates a draft document (doc_type='hr', source='generated'),
        attaches it back onto the order (hr_orders.document_id), and
        enqueues a docgen.render job — same async contract as
        POST /documents/generate.
      tags: [hr]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateHrDocumentExtra' }
      responses:
        '202':
          description: Accepted — render enqueued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateDocumentResponse' }
        '400': { description: Malformed id, or body is not a JSON object }
        '403': { description: 'No org context, or caller''s role is viewer' }
        '404': { description: Not found (including an HR order belonging to another organization) }
        '422': { description: 'The body tries to override a field derived from stored data (not_allowed_override), or the merged input fails the hr_order template''s JSON Schema (e.g. a required free-text field was not supplied)' }
        '503': { description: Job queue not enabled }

