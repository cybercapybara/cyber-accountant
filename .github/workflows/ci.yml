name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo; release/builder-cache workflows declare their own
# write scopes explicitly.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # End-to-end: builds the Docker builder stage (which compiles everything
    # with sanitizers and links the test binary), then runs the full gtest
    # suite against ephemeral Postgres + Redis containers via the `test`
    # compose profile — the same thing `make test` does locally.
    # 90, not 60: a cache-cold builder image spends ~30 min compiling the vcpkg
    # dependency world before a single test runs, and P2 grew the suite to 412
    # integration tests at ~2 s each. The two together overran 60 min and the
    # job was killed mid-suite with everything passing.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build builder image (cache warm)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: builder
          push: false
          load: true
          tags: cyber-accountant-template:builder
          build-args: ENABLE_WERROR=ON
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository }}/builder:cache
          cache-to: type=gha,mode=max

      - name: Run full test suite
        # `make test` builds the test-runner stage with
        # --cache-from cyber-accountant:builder-latest. Alias the builder we just loaded
        # under that tag so the compose build is a cache hit instead of a full
        # recompile.
        run: |
          docker tag cyber-accountant-template:builder cyber-accountant:builder-latest
          make test

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml --env-file docker/.env \
            --profile test logs test-runner || true

  lint-format:
    runs-on: ubuntu-latest
    # Pure text lint — doesn't need Docker, runs fast, gates style issues
    # before the heavier build job finishes.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install clang-format 17
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-17
          sudo ln -sf /usr/bin/clang-format-17 /usr/local/bin/clang-format

      - name: Check C++ formatting
        run: |
          mapfile -t files < <(find src tests -type f \
            \( -name '*.hpp' -o -name '*.cpp' -o -name '*.h' \))
          if [ ${#files[@]} -eq 0 ]; then
            echo "No C++ sources to check"; exit 0
          fi
          clang-format --dry-run --Werror "${files[@]}"

      - name: Shellcheck (scripts)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0
        with:
          scandir: ./scripts
          severity: warning

      - name: Shellcheck (docker)
        # docker/*.sh (Postgres replica setup) lives outside ./scripts. Second
        # invocation keeps the scandir scoping (the action only accepts one
        # scandir).
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0
        with:
          scandir: ./docker
          severity: warning

  secret-scan:
    runs-on: ubuntu-latest
    # Catch credentials before they land. We learned the hard way that a
    # local helm/values.yaml with stage passwords can slip into git.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # gitleaks needs history to scan past commits.
      # The official gitleaks-action requires a PAID license for repos owned by
      # an ORGANIZATION (it hard-fails with "missing gitleaks license" — a fork
      # of this template into any org would ship a permanently red gate). The
      # scanner itself is open source, so run the CLI directly: same rules,
      # same .gitleaks.toml, no license and no secrets.
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.21.2 detect \
              --source=/repo --config=/repo/.gitleaks.toml \
              --redact --verbose --exit-code 1

  openapi-drift:
    runs-on: ubuntu-latest
    # Pure-shell check — verifies (method, path) tuples in
    # Api::get_endpoints() match docs/openapi.yaml. Runs in seconds, gates
    # the heavier build job from going green if the spec is stale.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check OpenAPI drift
        run: ./scripts/check-openapi-drift.sh
      - name: Check routes registered
        run: ./scripts/check-routes-registered.sh
      - name: Check test-bucket filter sync
        run: ./scripts/check-test-buckets.sh

  helm-charts:
    runs-on: ubuntu-latest
    # Render the cpp-env umbrella with CI values and assert deploy-path
    # invariants (ingress<->service port match, MAIL_VIA_JOBS injected,
    # baseDomain expanded, no null ports). No cluster — pure template smoke
    # test. Catches the helm bug class that compile + unit tests cannot.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install helm + yq
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Validate helm render
        run: ./scripts/check-helm-render.sh

  frontend:
    runs-on: ubuntu-latest
    # Frontend gate — typecheck + lint + production build. Regenerates
    # schema.gen.ts from docs/openapi.yaml and fails if the committed copy
    # is stale (see the "schema.gen.ts up to date" step).
    timeout-minutes: 10
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate OpenAPI types
        run: npm run gen:api
      - name: schema.gen.ts up to date with docs/openapi.yaml
        # gen:api just rewrote schema.gen.ts from the spec. If the committed
        # copy differs, someone changed docs/openapi.yaml without running
        # `make frontend-gen-api` — fail so the stale file can't ride green.
        run: git diff --exit-code -- src/lib/api/schema.gen.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint  # flat config, zero-warning baseline
      - name: Production build
        run: npm run build

  clang-tidy:
    runs-on: ubuntu-latest
    # Structural and API-usage lint. Uses the builder image for
    # compile_commands.json so the analysis sees the real include paths
    # vcpkg resolved. Best-effort: warnings don't gate yet, the .clang-tidy
    # baseline is still being tightened.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build builder image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: builder
          push: false
          load: true
          tags: cyber-accountant-template:builder
          build-args: ENABLE_WERROR=ON
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository }}/builder:cache
          cache-to: type=gha,mode=max

      - name: Run clang-tidy inside builder
        # continue-on-error: ratchet — flip to false once baseline is clean.
        # Checks come from .clang-tidy in the repo root (mounted read-only):
        # bugprone-*, performance-*, portability-*, clang-analyzer-*.
        continue-on-error: true  # TODO: flip to false once baseline is clean
        run: |
          docker run --rm \
              -v "$PWD":/src \
              -v "$PWD/.clang-tidy":/app/.clang-tidy:ro \
              --entrypoint /bin/bash \
              cyber-accountant-template:builder -c "
                  apt-get update -qq && apt-get install -y -qq clang-tidy >/dev/null && \
                  run-clang-tidy -p /app/build -quiet -header-filter='src/.*' /app/src/ \
                      | tee /src/clang-tidy.log
              "

      - name: Upload clang-tidy log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clang-tidy-log
          path: clang-tidy.log
          if-no-files-found: ignore

  sanitizers:
    runs-on: ubuntu-latest
    # AddressSanitizer + UndefinedBehaviorSanitizer over the unit-test bucket.
    # Integration tests need real Postgres/Redis which aren't wired into this
    # job — keep them out of the filter. Allows a separate, fast feedback
    # signal for memory/UB regressions.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build builder image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: builder
          push: false
          load: true
          tags: cyber-accountant-template:builder
          build-args: ENABLE_WERROR=ON
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository }}/builder:cache
          cache-to: type=gha,mode=max

      - name: Build & run unit tests with ASan + UBSan
        run: |
          docker run --rm \
              --entrypoint /bin/bash \
              cyber-accountant-template:builder -c "
                  set -e
                  cd /app
                  rm -rf build-san
                  cmake -B build-san \
                      -G Ninja \
                      -DCMAKE_BUILD_TYPE=Debug \
                      -DENABLE_SANITIZERS=ON \
                      -DCMAKE_TOOLCHAIN_FILE=/opt/vcpkg/scripts/buildsystems/vcpkg.cmake \
                      -DVCPKG_INSTALLED_DIR=/app/build/vcpkg_installed  # reuse the builder stage's vcpkg tree (mirrors the sanitizer-builder Dockerfile stage); avoids a full vcpkg reinstall
                  cmake --build build-san -j\$(nproc) --target cyber_accountant_tests_unit
                  ASAN_OPTIONS=halt_on_error=1:detect_leaks=1 \
                  UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
                  ./build-san/cyber_accountant_tests_unit \
                      --gtest_color=yes
              "

  tsan:
    runs-on: ubuntu-latest
    # ThreadSanitizer over the unit-test bucket. The codebase leans on inline
    # singletons + atomics (ADR 0004) — exactly where races hide. Kept apart
    # from the ASan job: TSan can't share a process with ASan.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build builder image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: builder
          push: false
          load: true
          tags: cyber-accountant-template:builder
          build-args: ENABLE_WERROR=ON
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository }}/builder:cache
          cache-to: type=gha,mode=max

      - name: Build & run unit tests with TSan
        run: |
          docker run --rm \
              --entrypoint /bin/bash \
              cyber-accountant-template:builder -c "
                  set -e
                  cd /app
                  rm -rf build-tsan
                  cmake -B build-tsan \
                      -G Ninja \
                      -DCMAKE_BUILD_TYPE=Debug \
                      -DENABLE_TSAN=ON \
                      -DCMAKE_TOOLCHAIN_FILE=/opt/vcpkg/scripts/buildsystems/vcpkg.cmake \
                      -DVCPKG_INSTALLED_DIR=/app/build/vcpkg_installed
                  cmake --build build-tsan -j\$(nproc) --target cyber_accountant_tests_unit
                  TSAN_OPTIONS=halt_on_error=1:second_deadlock_stack=1 \
                  ./build-tsan/cyber_accountant_tests_unit \
                      --gtest_color=yes
              "

  template-render:
    runs-on: ubuntu-latest
    # Actually compiles every templates/docs/*/v*/fixtures/*.json through
    # Typst on the worker image — the only stage carrying a document engine
    # (docker/Dockerfile's worker-runtime stage). The unit/integration
    # buckets stub DOCGEN_TYPST_CMD (tests/integration/test_render_job.cpp),
    # so this is the ONLY gate that would catch a template that passes
    # schema validation and staging but doesn't actually compile.
    #
    # "It compiled" was never enough, and there is no engine transcript to ask
    # instead: v0.3.0 shipped templates whose amounts table hung off the right
    # edge of the page, and Typst does that kind of damage even more quietly —
    # it CLIPS silently, exits 0 and writes no log, so there is nothing to
    # grep. So this job reads the PDF it just produced
    # (scripts/check-render.py), in layers: every fixture value and every
    # static label must be in the extracted text (with printed money DERIVED
    # from the fixture's integer tiyn, never hand-written); every word box must
    # sit inside the page's margin box; no token may look like template syntax
    # the fixture cannot account for — screened by provenance, so the
    # special-chars fixtures' `#panic(` stays legal as DATA; and the page is
    # rasterised (pdftoppm) so that a rule drawn THROUGH a word, which text
    # extraction is blind to, fails too. The last step breaks six things on
    # purpose and requires the gate to catch all six, so it cannot rot into a
    # green rubber stamp. See the rationale block in
    # scripts/render-templates.sh.
    #
    # The PDFs themselves are kept and uploaded as the `rendered-documents`
    # artifact, so every template conversion in the Typst migration can still
    # get a human look at the raster. It is no longer the only defence: the
    # two defects that made it load-bearing — a rule struck through the party
    # identifiers, an `else` branch typeset as body text — are gated above.
    #
    # Path-scoped via dorny/paths-filter (a workflow-level `on.paths` would
    # gate every OTHER job in this file too) — only runs the (slow) docker
    # build + render when something docgen-relevant changed.
    permissions:
      contents: read
      pull-requests: read  # dorny/paths-filter needs this to list changed files via the API on pull_request events
    # Back to 30: the ceiling was raised to 45 because worker-runtime carried
    # TeX Live and a cache-cold build of that layer alone overran it. That
    # layer is gone — one 16.7 MiB Typst tarball and ~13 MiB of Noto replace
    # 154 MiB of apt downloads plus texlive-base's format generation.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Detect docgen-relevant changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            docgen:
              - 'templates/**'
              - 'src/docgen/**'
              - 'docker/Dockerfile'
              # The gate itself: a change to the render script, the PDF gate or
              # its self-test has to re-run against every template.
              - 'scripts/render-templates.sh'
              - 'scripts/check-render.py'
              - 'scripts/check-render-selftest.sh'

      - name: Set up Docker Buildx
        if: steps.changes.outputs.docgen == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build worker image (worker-render-check target — Typst + poppler)
        if: steps.changes.outputs.docgen == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: .
          file: docker/Dockerfile
          # worker-runtime plus pdftotext and python3, which the PDF gate needs
          # and the shipped worker does not — see the stage's comment. The
          # worker-runtime layers underneath are exactly the production ones.
          target: worker-render-check
          push: false
          load: true
          tags: cyber-accountant-template:worker-render
          build-args: ENABLE_WERROR=ON
          # The builder stage's registry cache (populated by
          # builder-cache.yml) lets the vcpkg/compile layers this stage
          # depends on (COPY --from=builder) hit cache instead of a cold
          # ~30-minute rebuild — same cache-from set the builder/sanitizer/
          # clang-tidy jobs above use for that stage.
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository }}/builder:cache
          cache-to: type=gha,mode=max

      - name: Assert the pinned engine version
        if: steps.changes.outputs.docgen == 'true'
        # The engine version is recorded on every rendered document version
        # (document_versions.render_engine) and is part of the render's
        # reproducibility contract. Typst is pre-1.0: a silent bump would
        # change layout under templates already in production use.
        #
        # `typst --version` prints `typst <version> (<8-char commit>)` — the
        # commit is part of the output, not optional, so this matches the
        # version token exactly and lets the commit follow it. 0.15.1 is tag
        # commit 9dfd3a08.
        #
        # The font check is the second half of the contract, and it is what
        # stands between the image and a well-meant "drop the last font
        # package too" cleanup: Typst carries no fonts of its own and finds
        # Noto Sans only by scanning /usr/share/fonts, where fonts-noto-core
        # puts it. That package was installed alongside TeX Live but was never
        # a TeX package, and it stayed when TeX Live went. If it ever leaves,
        # every template loses its Cyrillic and Kazakh glyphs — so it fails
        # here rather than in a rendered PDF.
        run: |
          docker run --rm --entrypoint typst \
            cyber-accountant-template:worker-render --version | tee /tmp/typst-version
          grep -qE '^typst 0\.15\.1( \(|$)' /tmp/typst-version
          docker run --rm --entrypoint typst \
            cyber-accountant-template:worker-render fonts | tee /tmp/typst-fonts
          grep -qx 'Noto Sans' /tmp/typst-fonts

      - name: Render every fixture and gate the PDF (content + geometry)
        if: steps.changes.outputs.docgen == 'true'
        run: |
          mkdir -p render-out && chmod 777 render-out
          docker run --rm \
            -v "$PWD/scripts:/scripts:ro" \
            -v "$PWD/render-out:/render-out" \
            -e KEEP_RENDERS=/render-out \
            -w /app \
            --entrypoint /bin/bash \
            cyber-accountant-template:worker-render \
            /scripts/render-templates.sh

      - name: Upload the rendered documents for human review
        # Not decoration. The text gate cannot see a rule drawn THROUGH the
        # party names, or a signature block whose rules collapsed onto them —
        # the Typst migration spike hit exactly that, and it was visible only
        # in a raster. Every converted template gets one human look at these
        # PDFs before its task is signed off.
        if: steps.changes.outputs.docgen == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rendered-documents
          path: render-out/**/main.pdf
          if-no-files-found: error
          retention-days: 14

      - name: Prove the gate bites (six deliberate breakages)
        if: steps.changes.outputs.docgen == 'true'
        # Breaks payslip, fno_910, tax_invoice and the fno_300 FIXTURE on
        # purpose — amounts column emptied, one amount truncated, table widened
        # past the page, amounts rewritten into the machine money form — and
        # fails unless the gate catches each one AND names what was lost. A
        # gate only ever run against healthy input is indistinguishable from
        # `exit 0`. The self-test also fingerprints the template tree around
        # each mutation and fails loudly if a mutator changed nothing, which is
        # what a LaTeX-syntax mutator does once its template becomes Typst.
        run: |
          docker run --rm \
            -v "$PWD/scripts:/scripts:ro" \
            -w /app \
            --entrypoint /bin/bash \
            cyber-accountant-template:worker-render \
            /scripts/check-render-selftest.sh

      - name: Report the worker image size
        if: steps.changes.outputs.docgen == 'true'
        # The one number the Typst migration was justified on that nothing
        # measured: the spike could only resolve apt metadata, because Docker
        # was not available on the machine it ran on. This is the built image,
        # in bytes. worker-render-check = the production worker-runtime layers
        # plus poppler-utils and python3, so it reads a little high; the
        # worker-runtime layers underneath are the ones that ship.
        run: |
          docker image inspect cyber-accountant-template:worker-render \
            --format '{{.Size}} bytes ({{div .Size 1048576}} MiB)'
